name: ML CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run model and evaluation tests
        run: python -m pytest -q

      - name: Run Evaluation v2
        run: python evaluation.py

      - name: Run Evaluation v3
        run: python evaluation_v3.py

      - name: Run final locked champion validation
        run: python final_validation.py

      - name: Build reproducible Model v3 artifact
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: python model_v3.py

      - name: Upload Model v3 artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-v3-${{ github.sha }}
          path: |
            model_v3.joblib
            model_v3_metadata.json

      - name: Run training pipeline
        run: python HOUSE.py
